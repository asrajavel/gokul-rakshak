<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gokul Rakshak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #120a1f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const W = 1280, H = 720, STEP = 1 / 120;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const TEST = new URLSearchParams(location.search).has('test');
const TITLE_FONT = '"Yatra One", Georgia, serif', UI_FONT = 'Mukta, system-ui, sans-serif';
const HOMES = [[560, 470], [700, 455], [630, 545], [770, 535], [500, 555]];
const FLUTE_BTN = { x: 640, y: 670, r: 32 };
const TYPES = {
  imp: { hp: 1, r: 18, speed: [72, 95], score: 100, oy: 24 },
  brute: { hp: 3, r: 26, speed: [45, 55], score: 250, oy: 34 },
  baka: { hp: 2, r: 24, speed: [115, 135], score: 200, oy: 62 },
  trina: { hp: 3, r: 24, speed: [90, 105], score: 250, oy: 50 },
  agha: { hp: 10, r: 22, speed: [52, 52], score: 1000, oy: 14 },
};
const WAVES = [
  { name: 'The Asuras Arrive', list: { imp: 8 }, gap: 1.5 },
  { name: 'Bakasura Descends', list: { imp: 8, baka: 4 }, gap: 1.3 },
  { name: "Trinavarta's Whirlwind", list: { imp: 8, brute: 3, trina: 3 }, gap: 1.2 },
  { name: 'Aghasura the Serpent', list: { imp: 10, brute: 3, baka: 3, trina: 2, agha: 1 }, gap: 1.05 },
  { name: 'Kaliya of the Yamuna', boss: true },
];

// ---------- utils ----------
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function oval(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr; }
function line(g, x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function makeGlow(rgb) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.25, `rgba(${rgb},.45)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return c;
}
const GLOW = { gold: makeGlow('255,200,80'), blue: makeGlow('110,180,255'), green: makeGlow('130,255,110'), red: makeGlow('255,70,40'), purple: makeGlow('190,90,255'), white: makeGlow('255,255,255'), ff: makeGlow('215,255,120'), pink: makeGlow('255,120,200') };
function glow(img, x, y, r, a = 1) {
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a, 0, 1);
  ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---------- audio ----------
let actx = null, master = null;
function initAudio() {
  if (actx || TEST) return;
  try {
    actx = new AudioContext(); master = actx.createGain(); master.gain.value = .7; master.connect(actx.destination);
    for (const [f, v] of [[146.83, .018], [220, .012], [293.66, .008]]) { // tanpura-like drone: Sa, Pa, Sa'
      const o = actx.createOscillator(), g = actx.createGain(), l = actx.createOscillator(), lg = actx.createGain();
      o.frequency.value = f; g.gain.value = v; l.frequency.value = .15 + Math.random() * .2; lg.gain.value = v * .6;
      l.connect(lg).connect(g.gain); o.connect(g).connect(master); o.start(); l.start();
    }
  } catch { actx = null; }
}
function tone(f, d, o = {}) {
  if (!actx) return;
  const { type = 'sine', v = .08, f2 = 0, delay = 0, vib = 0, lp = 0, att = .02 } = o;
  const t = actx.currentTime + delay, osc = actx.createOscillator(), g = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  let node = osc;
  if (lp) { const fl = actx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; node.connect(fl); node = fl; }
  node.connect(g).connect(master);
  if (vib) { const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 5.5; lg.gain.value = f * vib; l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t + d + .05); }
  osc.start(t); osc.stop(t + d + .05);
}
function whoosh(d = .25, v = .12) {
  if (!actx) return;
  const b = actx.createBuffer(1, actx.sampleRate * d, actx.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime;
  s.buffer = b; f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(2500, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f).connect(g).connect(master); s.start();
}
const SA = 587.33, RAGA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4]; // Bhupali: Sa Re Ga Pa Dha Sa' Re'
function melody(notes, dur, v = .07) { let t = 0; for (const n of notes) { tone(SA * RAGA[n], dur * 1.6, { v, vib: .012, delay: t, att: .05 }); t += dur; } }
const SFX = {
  throw: () => whoosh(),
  hit: () => tone(200, .12, { type: 'square', v: .06, f2: 80, lp: 1200 }),
  kill: () => { tone(420, .3, { type: 'triangle', v: .09, f2: 900 }); tone(1560, .4, { v: .04, delay: .1 }); },
  moo: () => tone(150, .8, { type: 'sawtooth', v: .06, f2: 105, lp: 700, att: .15 }),
  bell: () => { tone(1318, .6, { v: .07 }); tone(1976, .8, { v: .05, delay: .06 }); },
  flute: () => melody([0, 1, 2, 4, 3, 2, 4, 5, 6, 5], .13, .08),
  conch: () => { tone(233, 1.6, { type: 'sawtooth', v: .07, f2: 247, lp: 900, att: .3 }); tone(466, 1.6, { type: 'sine', v: .03, att: .3 }); },
  spit: () => tone(320, .3, { type: 'sawtooth', v: .04, f2: 110, lp: 900 }),
  head: () => { tone(110, .8, { type: 'sawtooth', v: .09, f2: 45, lp: 600 }); whoosh(.4, .08); },
  power: () => [0, 2, 3, 5].forEach((n, i) => tone(SA * RAGA[n], .25, { v: .05, delay: i * .07 })),
  win: () => { melody([0, 1, 2, 4, 5, 4, 5, 6, 5, 4, 2, 4, 5], .16, .09); [0, .5, 1].forEach(d => tone(1976, .8, { v: .04, delay: d })); },
  lose: () => [4, 3, 2, 1, 0].forEach((n, i) => tone(SA * RAGA[n] / 2, .5, { v: .07, delay: i * .22, vib: .01 })),
};
const sfx = n => SFX[n]();

// ---------- pre-rendered background ----------
let S = 1, OX = 0, OY = 0, dpr = 1, bg, vig;
const SUN = { x: 910, y: 236 };

function temple(g, x, b) {
  g.fillStyle = '#2a1540';
  g.fillRect(x - 30, b - 26, 60, 26);
  g.beginPath(); g.moveTo(x - 20, b - 26); g.bezierCurveTo(x - 18, b - 60, x - 6, b - 78, x, b - 86); g.bezierCurveTo(x + 6, b - 78, x + 18, b - 60, x + 20, b - 26); g.fill();
  circle(g, x, b - 88, 4); g.fillRect(x - .8, b - 106, 1.6, 18);
  g.fillStyle = '#ff8a2a'; g.beginPath(); g.moveTo(x + .8, b - 106); g.lineTo(x + 15, b - 102); g.lineTo(x + .8, b - 98); g.fill();
  const lg = g.createRadialGradient(x, b - 8, 0, x, b - 8, 26); lg.addColorStop(0, 'rgba(255,180,80,.7)'); lg.addColorStop(1, 'rgba(255,180,80,0)');
  g.fillStyle = lg; g.fillRect(x - 26, b - 34, 52, 34);
  g.fillStyle = '#ffc56b'; g.fillRect(x - 4, b - 15, 8, 13);
}
function hut(g, x, b) {
  g.fillStyle = '#2a1540'; g.fillRect(x - 14, b - 14, 28, 14);
  g.beginPath(); g.moveTo(x - 19, b - 13); g.lineTo(x, b - 30); g.lineTo(x + 19, b - 13); g.fill();
  g.fillStyle = '#ffb35c'; g.fillRect(x - 3, b - 10, 6, 6);
}
function kadamba(g, x, b, r) {
  g.fillStyle = 'rgba(15,30,10,.4)'; oval(g, x, b, 70, 12);
  g.fillStyle = lin(g, x - 24, 0, x + 24, 0, ['#2e1c12', '#6b4430', '#3a2418']);
  g.beginPath(); g.moveTo(x - 24, b); g.quadraticCurveTo(x - 8, b - 60, x - 12, b - 150); g.lineTo(x + 10, b - 150); g.quadraticCurveTo(x + 6, b - 60, x + 26, b); g.fill();
  g.strokeStyle = '#4a2e1f'; g.lineWidth = 8; g.lineCap = 'round';
  line(g, x - 4, b - 120, x - 62, b - 172); line(g, x, b - 125, x + 52, b - 178);
  const cx = x, cy = b - 198;
  for (let i = 0; i < 50; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()), px = cx + Math.cos(a) * d * 112, py = cy + Math.sin(a) * d * 62, lit = Math.max(0, (px - cx) / 112 - (py - cy) / 120);
    g.fillStyle = `hsl(${100 + r() * 25},${32 + r() * 15}%,${13 + r() * 7 + lit * 12}%)`; circle(g, px, py, 20 + r() * 16);
  }
  for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + r() * Math.PI * .9, px = cx + Math.cos(a) * 118, py = cy + Math.sin(a) * 70; g.fillStyle = `rgba(255,190,110,${.12 + r() * .12})`; circle(g, px, py, 12 + r() * 10); }
  for (let i = 0; i < 60; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()), px = cx + Math.cos(a) * d * 115, py = cy + Math.sin(a) * d * 70;
    g.fillStyle = '#f2a023'; circle(g, px, py, 3.6); g.fillStyle = '#ffe28a'; circle(g, px - .9, py - .9, 1.6);
  }
}
function paintBG(g) {
  const r = rng(42);
  g.fillStyle = lin(g, 0, 0, 0, 262, ['#1a1242', '#3e2a74', '#9a4580', '#ec7a4f', '#ffc27a']); g.fillRect(0, 0, W, 262);
  for (let i = 0; i < 110; i++) { const y = r() * 170; g.fillStyle = `rgba(255,250,235,${(1 - y / 170) * (.3 + r() * .6)})`; circle(g, r() * W, y, .4 + r() * 1.2); }
  const sg = g.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 430);
  sg.addColorStop(0, 'rgba(255,220,150,.75)'); sg.addColorStop(.25, 'rgba(255,170,110,.3)'); sg.addColorStop(1, 'rgba(255,150,100,0)');
  g.fillStyle = sg; g.fillRect(0, 0, W, 320);
  const sd = g.createRadialGradient(SUN.x, SUN.y - 10, 0, SUN.x, SUN.y, 56);
  sd.addColorStop(0, '#fffbe0'); sd.addColorStop(.6, '#ffd27a'); sd.addColorStop(1, '#ff9a4a');
  g.fillStyle = sd; circle(g, SUN.x, SUN.y, 54);
  for (let i = 0; i < 10; i++) {
    const y = 60 + r() * 150, x = r() * W, w = 90 + r() * 220, h = 8 + r() * 8;
    g.fillStyle = lin(g, 0, y, 0, y + h, [`rgba(255,${200 + r() * 40 | 0},${160 + r() * 40 | 0},${.3 + r() * .25})`, 'rgba(160,60,120,.25)']); rr(g, x - w / 2, y, w, h, h / 2); g.fill();
  }
  const hill = (base, amp, col, f, ph) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, 300);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, base - amp * (.5 + .5 * Math.sin(x * f + ph)) * (.6 + .4 * Math.sin(x * f * 2.3 + ph * 2)));
    g.lineTo(W, 300); g.fill();
  };
  hill(246, 75, '#6a3b7c', .005, 1); hill(254, 45, '#4b2862', .011, 3);
  g.fillStyle = '#2c1742';
  for (let x = -10; x < W + 20; x += 14 + r() * 26) if (x < 960 || x > 1215) circle(g, x, 254 - r() * 6, 8 + r() * 12);
  g.fillRect(0, 250, W, 12);
  temple(g, 1090, 260); hut(g, 995, 260); hut(g, 1185, 260);
  // Yamuna
  g.fillStyle = lin(g, 0, 258, 0, 314, ['#6a4f93', '#3b3a80', '#22306a']); g.fillRect(0, 258, W, 56);
  for (let i = 0; i < 16; i++) { g.fillStyle = `rgba(255,200,120,${.55 - i * .03})`; const w = (90 - i * 4) * (.7 + r() * .6); g.fillRect(SUN.x - w / 2 + (r() - .5) * 20, 262 + i * 3.2, w, 1.6); }
  for (let i = 0; i < 11; i++) {
    const x = r() * W, y = 272 + r() * 30;
    if (Math.abs(x - 640) < 170) continue;
    g.fillStyle = '#2f6b44'; oval(g, x, y, 14, 4.4);
    if (r() < .6) { g.fillStyle = '#ff9fc4'; for (const k of [-1, 0, 1]) oval(g, x + 3 + k * 4, y - 5, 3, 6.5, k * .5); g.fillStyle = '#ffd166'; circle(g, x + 3, y - 3, 1.8); }
  }
  // bank + meadow
  const edge = [];
  for (let x = 0; x <= W; x += 10) edge.push([x, 306 + Math.sin(x * .02) * 3 + r() * 2]);
  g.beginPath(); g.moveTo(0, H); edge.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W, H); g.closePath();
  g.fillStyle = lin(g, 0, 300, 0, H, ['#86a845', '#5f8c37', '#3e6c2c', '#264a20']); g.fill();
  g.strokeStyle = 'rgba(255,210,140,.4)'; g.lineWidth = 2; g.beginPath(); edge.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  const wl = g.createRadialGradient(SUN.x, 300, 0, SUN.x, 300, 780);
  wl.addColorStop(0, 'rgba(255,170,90,.28)'); wl.addColorStop(1, 'rgba(255,170,90,0)');
  g.fillStyle = wl; g.fillRect(0, 300, W, H - 300);
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(205,170,110,.3)'; g.lineWidth = 46; g.beginPath(); g.moveTo(400, H + 30); g.bezierCurveTo(470, 640, 370, 570, 600, 505); g.stroke();
  g.strokeStyle = 'rgba(230,200,140,.18)'; g.lineWidth = 28; g.stroke();
  for (let i = 0; i < 3200; i++) {
    const x = r() * W, y = 312 + r() * (H - 312), d = (y - 300) / 420;
    g.strokeStyle = `hsla(${78 + r() * 34},${38 + r() * 22}%,${20 + r() * 26}%,.8)`; g.lineWidth = .8 + d * 1.3;
    line(g, x, y, x + (r() - .5) * 5, y - (3 + d * 9));
  }
  for (let i = 0; i < 150; i++) {
    const x = r() * W, y = 320 + r() * (H - 320);
    g.fillStyle = `hsl(${[45, 330, 0, 280, 200][r() * 5 | 0]},85%,${60 + r() * 15}%)`; circle(g, x, y, 1.1 + r() * 2 * (y / H));
  }
  kadamba(g, 140, 432, r);
}
function paintVignette(g) {
  const v = g.createRadialGradient(W / 2, H * .55, H * .42, W / 2, H * .55, W * .72);
  v.addColorStop(0, 'rgba(25,8,35,0)'); v.addColorStop(1, 'rgba(25,8,35,.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  S = Math.min(cvs.width / W, cvs.height / H); OX = (cvs.width - W * S) / 2; OY = (cvs.height - H * S) / 2;
  const mk = fn => { const c = document.createElement('canvas'); c.width = Math.ceil(W * S); c.height = Math.ceil(H * S); const g = c.getContext('2d'); g.scale(S, S); fn(g); return c; };
  bg = mk(paintBG); vig = mk(paintVignette);
}

// ---------- state ----------
let state, endT, gt = 0, score, wave, queue, spawnT, bannerT, waveDoneT, autoWaves;
let kr, ch, demons, cows, particles, texts, venoms, butters, butterT, power, flute, ring, boss;
const mouse = { x: 640, y: 560 };
const fireflies = Array.from({ length: 34 }, (_, i) => ({ x: hash(i) * W, y: 150 + hash(i + 50) * 540, p: hash(i + 9) * 10 }));

function reset() {
  state = 'title'; endT = 0; score = 0; wave = 0; queue = []; spawnT = 0; bannerT = 0; waveDoneT = 0; autoWaves = true;
  kr = { x: 640, y: 640, face: 1, walk: 0, moving: false, bob: 0 };
  ch = { x: 640, y: 500, state: 'held', tx: 0, ty: 0, rot: 0, hits: new Set(), trail: [] };
  demons = []; particles = []; texts = []; venoms = []; butters = []; butterT = 12; power = 0; flute = 0; ring = null; boss = null;
  cows = HOMES.map(([x, y], i) => ({ x, y, hx: x, hy: y, wx: x, wy: y, state: 'home', dir: i % 2 ? 1 : -1, t: i * 1.7, wt: 0, moving: false }));
}
function startGame() { state = 'play'; startWave(0); }
function startWave(i) {
  wave = i; bannerT = 3.2; waveDoneT = 0; spawnT = 3;
  const w = WAVES[i];
  queue = shuffle(Object.entries(w.list || {}).flatMap(([t, n]) => Array(n).fill(t)));
  if (queue.includes('agha')) { queue = queue.filter(t => t !== 'agha'); queue.push('agha'); }
  if (w.boss) boss = { x: 640, y: 300, rise: 0, spitT: 3, summonT: 4, heads: [0, 1, 2, 3, 4].map(() => ({ hp: 8, flash: 0 })) };
  sfx('conch');
}

// ---------- effects ----------
function addText(x, y, s, col = '#ffe9a8', size = 22) { texts.push({ x, y, s, col, size, t: 0 }); }
function burst(x, y, col, n, sp = 220) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = sp * (.3 + Math.random() * .7); particles.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .3, max: .8, size: 3 + Math.random() * 3, col, g: 150 }); } }
function smoke(x, y, n) { for (let i = 0; i < n; i++) particles.push({ k: 'smoke', x: x + (Math.random() - .5) * 24, y: y + (Math.random() - .5) * 24, vx: (Math.random() - .5) * 60, vy: -20 - Math.random() * 40, life: .9, max: .9, size: 9 + Math.random() * 12, g: 0 }); }
function orb(x, y) { particles.push({ k: 'orb', x, y, vx: 0, vy: -70, life: 1.8, max: 1.8, size: 14, g: 0, ph: Math.random() * 6 }); }
function note(x, y) { particles.push({ k: 'note', x, y, vx: (Math.random() - .5) * 60, vy: -40 - Math.random() * 40, life: 1.8, max: 1.8, size: 20 + Math.random() * 10, g: 0, s: '♪♫♬'[Math.random() * 3 | 0], hue: [45, 190, 320][Math.random() * 3 | 0] }); }
function petal(x, y) { particles.push({ k: 'petal', x, y, vx: 15 + Math.random() * 30, vy: 40 + Math.random() * 50, life: 7, max: 7, size: 4 + Math.random() * 3, g: 0, rot: Math.random() * 6, vr: (Math.random() - .5) * 6, hue: [340, 20, 45, 300][Math.random() * 4 | 0] }); }

// ---------- gameplay ----------
const hand = () => ({ x: kr.x + kr.face * 20, y: kr.y + kr.bob - 124 });
const activeCows = () => cows.filter(c => c.state === 'home' || c.state === 'return');
function centers(e) { return e.type === 'agha' ? e.segs : [{ x: e.x, y: e.y - TYPES[e.type].oy, r: e.r }]; }

function spawnDemon(type, x, y) {
  if (x === undefined) {
    if (type === 'baka') { x = rand(100, W - 100); y = -60; }
    else { const s = Math.random(); if (s < .4) { x = -40; y = rand(340, 700); } else if (s < .8) { x = W + 40; y = rand(340, 700); } else { x = rand(100, W - 100); y = H + 40; } }
  }
  const T = TYPES[type];
  const d = { type, x, y, hp: T.hp, max: T.hp, r: T.r, speed: rand(...T.speed), t: Math.random() * 5, flash: 0, kx: 0, ky: 0, face: 1, carry: null, dead: false, trail: [], segs: [] };
  if (type === 'agha') d.segs = [{ x, y: y - 14, r: 22 }];
  demons.push(d); return d;
}

function throwChakra(x, y) {
  if (ch.state === 'held') { const h = hand(); ch.x = h.x; ch.y = h.y - 13; }
  ch.state = 'out'; ch.tx = x; ch.ty = y; ch.hits.clear(); sfx('throw');
}
function damage(e, n, sx, sy) {
  if (e.dead) return;
  e.hp -= n; e.flash = .15;
  const c = centers(e)[0], dx = c.x - sx, dy = c.y - sy, d = Math.hypot(dx, dy) || 1, kb = { agha: 60, brute: 140 }[e.type] || 260;
  e.kx += dx / d * kb; e.ky += dy / d * kb;
  burst(sx, sy, 'gold', 6); sfx('hit');
  if (e.hp <= 0) kill(e);
}
function kill(e, quiet) {
  e.dead = true;
  const cs = centers(e);
  if (e.carry) { const c = e.carry; c.state = 'return'; e.carry = null; addText(c.x, c.y - 70, 'Saved!', '#b6ffbf'); }
  for (const c of e.type === 'agha' ? cs : cs.slice(0, 1)) smoke(c.x, c.y, e.type === 'agha' ? 5 : 14);
  orb(cs[0].x, cs[0].y);
  if (quiet) return;
  const pts = TYPES[e.type].score;
  score += pts; flute = Math.min(1, flute + (e.type === 'agha' ? .5 : .1));
  addText(cs[0].x, cs[0].y - 30, '+' + pts); burst(cs[0].x, cs[0].y, 'gold', 14, 260); sfx('kill');
}
function headPos(i) {
  const b = boss, h = b.heads[i];
  const ang = -Math.PI / 2 + (i - 2) * .45 + Math.sin(gt * 1.4 + i * 1.3) * .07;
  const L = (i === 2 ? 150 : 125) * b.rise;
  const droop = h.hp <= 0 || state === 'won' ? 55 : 0;
  return { x: b.x + Math.cos(ang) * L * 1.5, y: b.y + Math.sin(ang) * L + droop + (1 - b.rise) * 60 };
}
function damageHead(i, n) {
  const h = boss.heads[i]; if (h.hp <= 0) return;
  const p = headPos(i);
  h.hp -= n; h.flash = .15; flute = Math.min(1, flute + .04);
  burst(p.x, p.y, 'gold', 8); sfx('hit');
  if (h.hp <= 0) { score += 1000; addText(p.x, p.y - 40, '+1000'); smoke(p.x, p.y, 16); burst(p.x, p.y, 'green', 20, 300); sfx('head'); }
}
function playFlute() {
  if (flute < 1 || state !== 'play') return;
  flute = 0; ring = { x: kr.x, y: kr.y - 50, r: 0, hit: new Set() }; sfx('flute');
  for (let i = 0; i < 10; i++) note(kr.x + rand(-40, 40), kr.y - 60 - rand(0, 40));
}
function win() {
  state = 'won'; endT = 0; score += 2000;
  for (const e of demons) kill(e, true);
  demons = []; venoms = []; ring = null; ch.state = 'held';
  kr.sx = kr.x; kr.sy = kr.y; sfx('win');
}
function lose() { state = 'lost'; endT = 0; sfx('lose'); }

function click(x, y) {
  initAudio();
  if (state === 'title') return startGame();
  if (state === 'won' || state === 'lost') { if (endT > 1.2) { reset(); startGame(); } return; }
  if (dist(x, y, FLUTE_BTN.x, FLUTE_BTN.y) < FLUTE_BTN.r + 8 && flute >= 1) return playFlute();
  throwChakra(x, y);
}

function moveTo(o, tx, ty, sp, dt) {
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if (Math.abs(dx) > 1) o.dir = Math.sign(dx);
  if (d <= sp * dt + .5) { o.x = tx; o.y = ty; o.moving = false; return true; }
  o.x += dx / d * sp * dt; o.y += dy / d * sp * dt; o.moving = true; return false;
}

function updateKrishna(dt) {
  const tx = clamp(mouse.x, 30, W - 30), ty = clamp(mouse.y, 335, H - 16);
  const dx = tx - kr.x, dy = ty - kr.y, d = Math.hypot(dx, dy), sp = Math.min(d * 9, 620);
  if (d > .5) { kr.x += dx / d * sp * dt; kr.y += dy / d * sp * dt; }
  kr.moving = sp > 30; if (Math.abs(dx) > 3) kr.face = Math.sign(dx);
  kr.walk += sp * dt * .05; kr.bob = kr.moving ? -Math.abs(Math.sin(kr.walk)) * 3 : Math.sin(gt * 2) * 1;
}

function updateChakra(dt) {
  const R = power > 0 ? 30 : 20, spd = power > 0 ? 1450 : 1150, dmg = power > 0 ? 2 : 1;
  ch.rot += dt * (ch.state === 'held' ? 7 : 28);
  const h = hand();
  if (ch.state === 'held') { ch.x = h.x; ch.y = h.y - 13; ch.trail.length = 0; return; }
  const out = ch.state === 'out', tx = out ? ch.tx : h.x, ty = out ? ch.ty : h.y - 13;
  const dx = tx - ch.x, dy = ty - ch.y, d = Math.hypot(dx, dy), s = spd * (out ? 1 : 1.15) * dt;
  if (d <= s) {
    ch.x = tx; ch.y = ty;
    if (out) { ch.state = 'return'; ch.hits.clear(); } else { ch.state = 'held'; return; }
  } else { ch.x += dx / d * s; ch.y += dy / d * s; }
  ch.trail.unshift({ x: ch.x, y: ch.y }); if (ch.trail.length > 10) ch.trail.pop();
  for (const e of demons) {
    if (e.dead || ch.hits.has(e)) continue;
    if (centers(e).some(c => dist(c.x, c.y, ch.x, ch.y) < c.r + R)) { ch.hits.add(e); damage(e, dmg, ch.x, ch.y); }
  }
  if (boss && boss.rise > .85) boss.heads.forEach((hd, i) => {
    if (hd.hp > 0 && !ch.hits.has(hd)) { const p = headPos(i); if (dist(p.x, p.y, ch.x, ch.y) < 26 + R) { ch.hits.add(hd); damageHead(i, dmg); } }
  });
  for (const v of venoms) if (!v.dead && dist(v.x, v.y, ch.x, ch.y) < R + 12) { v.dead = true; burst(v.x, v.y, 'green', 10); }
}

function updateDemons(dt) {
  for (const d of demons) {
    if (d.dead) continue;
    d.t += dt; d.flash = Math.max(0, d.flash - dt);
    d.x += d.kx * dt; d.y += d.ky * dt; const damp = Math.pow(.02, dt); d.kx *= damp; d.ky *= damp;
    let tx, ty, sp = d.speed, target = null;
    if (d.carry) { [tx, ty] = d.exit; sp *= .65; }
    else {
      let best = Infinity;
      for (const c of activeCows()) { const dd = dist(c.x, c.y, d.x, d.y); if (dd < best) { best = dd; target = c; } }
      [tx, ty] = target ? [target.x, target.y] : [640, 480];
    }
    let dx = tx - d.x, dy = ty - d.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const wob = { trina: Math.sin(d.t * 3) * 1.2, baka: Math.sin(d.t * 2) * .7, agha: Math.sin(d.t * 4) * .9 }[d.type] || 0;
    const mx = dx - dy * wob, my = dy + dx * wob, m = Math.hypot(mx, my) || 1;
    d.x += mx / m * sp * dt; d.y += my / m * sp * dt;
    if (Math.abs(mx) > .1) d.face = Math.sign(mx);
    if (d.type !== 'baka' && !d.carry) d.y = Math.max(d.y, 330);
    // Krishna shoves demons aside
    const kd = dist(d.x, d.y, kr.x, kr.y), kmin = d.r + 22;
    if (d.type !== 'baka' && kd < kmin && kd > 0) { d.x += (d.x - kr.x) / kd * (kmin - kd); d.y += (d.y - kr.y) / kd * (kmin - kd); }
    if (d.type === 'agha') {
      const last = d.trail[0];
      if (!last || dist(last.x, last.y, d.x, d.y) > 3) { d.trail.unshift({ x: d.x, y: d.y }); if (d.trail.length > 70) d.trail.pop(); }
      d.segs = [{ x: d.x, y: d.y - 14, r: 22 }];
      for (let i = 1; i <= 12; i++) { const p = d.trail[Math.min(i * 5, d.trail.length - 1)]; d.segs.push({ x: p.x, y: p.y - 12, r: 18 - i * .8 }); }
    }
    if (!d.carry && target && dist(target.x, target.y, d.x, d.y) < d.r + 26) {
      target.state = 'carried'; d.carry = target;
      d.exit = d.type === 'baka' ? [d.x + d.face * 250, -160] : [[-100, d.y], [W + 100, d.y], [d.x, H + 100]].sort((a, b) => dist(...a, d.x, d.y) - dist(...b, d.x, d.y))[0];
      addText(target.x, target.y - 70, 'Moo!', '#ffd0d0'); sfx('moo');
    }
    if (d.carry) {
      const c = d.carry;
      if (d.type === 'baka') { c.x = d.x; c.y = d.y + .1; c.lift = 30; }
      else { c.x = d.x - dx * 42; c.y = d.y - dy * 12 + .1; c.lift = 0; c.dir = dx > 0 ? -1 : 1; }
      if (d.x < -70 || d.x > W + 70 || d.y > H + 70 || d.y < -120) { c.state = 'lost'; d.dead = true; addText(clamp(d.x, 60, W - 60), clamp(d.y, 120, H - 40), 'A cow was taken!', '#ff9f9f'); }
    }
  }
  demons = demons.filter(d => !d.dead);
}

function updateCows(dt) {
  for (const c of cows) {
    c.t += dt;
    if (c.state === 'home') {
      c.wt -= dt;
      if (c.wt <= 0) { c.wt = 3 + Math.random() * 4; c.wx = c.hx + (Math.random() - .5) * 50; c.wy = c.hy + (Math.random() - .5) * 30; }
      moveTo(c, c.wx, c.wy, 22, dt);
    } else if (c.state === 'return') {
      c.lift = 0;
      if (moveTo(c, c.hx, c.hy, 110, dt)) { c.state = 'home'; c.wt = 0; }
    } else if (c.state === 'flee') {
      moveTo(c, c.fx, c.fy, 160, dt);
      if (dist(c.x, c.y, kr.x, kr.y) < 55) { c.state = 'return'; addText(c.x, c.y - 70, 'Calmed', '#b6ffbf'); sfx('bell'); }
      else if (c.x < -60 || c.x > W + 60) c.state = 'lost';
    }
  }
  if (cows.every(c => c.state === 'lost')) lose();
}

function updateBoss(dt) {
  if (!boss) return;
  boss.rise = Math.min(1, boss.rise + dt / 2.5);
  for (const h of boss.heads) h.flash = Math.max(0, h.flash - dt);
  if (state !== 'play') return;
  if (boss.rise >= 1) {
    if ((boss.spitT -= dt) <= 0) {
      boss.spitT = 2 + Math.random() * 1.2;
      const alive = boss.heads.map((h, i) => i).filter(i => boss.heads[i].hp > 0), tgt = activeCows();
      if (alive.length && tgt.length) {
        const p = headPos(alive[Math.random() * alive.length | 0]), c = tgt[Math.random() * tgt.length | 0];
        const dx = c.x - p.x, dy = c.y - 30 - p.y, d = Math.hypot(dx, dy);
        venoms.push({ x: p.x, y: p.y + 10, vx: dx / d * 185, vy: dy / d * 185, dead: false }); sfx('spit');
      }
    }
    if ((boss.summonT -= dt) <= 0) { boss.summonT = 3.5; if (demons.length < 6) spawnDemon(Math.random() < .25 ? 'baka' : 'imp'); }
  }
  if (boss.heads.every(h => h.hp <= 0)) win();
}

function updateVenom(dt) {
  for (const v of venoms) {
    v.x += v.vx * dt; v.y += v.vy * dt;
    if (Math.random() < .5) particles.push({ k: 'spark', x: v.x, y: v.y, vx: 0, vy: 0, life: .35, max: .35, size: 4, col: 'green', g: 0 });
    if (dist(v.x, v.y, kr.x, kr.y - 50) < 44) { v.dead = true; burst(v.x, v.y, 'gold', 10); continue; }
    for (const c of activeCows()) if (dist(v.x, v.y, c.x, c.y - 30) < 30) {
      v.dead = true; c.state = 'flee'; c.fx = c.x < 640 ? -120 : W + 120; c.fy = c.y;
      burst(v.x, v.y, 'green', 14); addText(c.x, c.y - 70, 'Moo!', '#ffd0d0'); sfx('moo'); break;
    }
    if (v.x < -40 || v.x > W + 40 || v.y > H + 40) v.dead = true;
  }
  venoms = venoms.filter(v => !v.dead);
}

function updateButter(dt) {
  power = Math.max(0, power - dt);
  if ((butterT -= dt) <= 0 && butters.length < 2) { butterT = 13 + Math.random() * 6; butters.push({ x: rand(200, 1100), y: rand(390, 680), life: 10 }); }
  for (const b of butters) {
    b.life -= dt;
    if (dist(b.x, b.y, kr.x, kr.y) < 44) { b.life = 0; power = 7; score += 50; sfx('bell'); sfx('power'); burst(b.x, b.y - 20, 'gold', 18); addText(b.x, b.y - 60, 'Makhan power!', '#fff3b0', 26); }
  }
  butters = butters.filter(b => b.life > 0);
}

function updateRing(dt) {
  if (!ring) return;
  ring.r += 950 * dt;
  for (const e of demons) if (!ring.hit.has(e) && centers(e).some(c => dist(c.x, c.y, ring.x, ring.y) <= ring.r)) { ring.hit.add(e); damage(e, 3, ring.x, ring.y); }
  if (boss) boss.heads.forEach((h, i) => { if (!ring.hit.has(h)) { const p = headPos(i); if (dist(p.x, p.y, ring.x, ring.y) <= ring.r) { ring.hit.add(h); damageHead(i, 2); } } });
  for (const v of venoms) if (dist(v.x, v.y, ring.x, ring.y) <= ring.r) { v.dead = true; burst(v.x, v.y, 'green', 6); }
  if (ring.r > 1500) ring = null;
}

function updateWaves(dt) {
  bannerT = Math.max(0, bannerT - dt);
  if (queue.length && (spawnT -= dt) <= 0) { spawnDemon(queue.shift()); spawnT = WAVES[wave].gap * rand(.6, 1.4); }
  if (!autoWaves || boss || queue.length || demons.length) return;
  if ((waveDoneT += dt) > 1.5) {
    const lost = cows.find(c => c.state === 'lost');
    if (lost) { lost.state = 'return'; lost.x = lost.hx < 640 ? -60 : W + 60; lost.y = lost.hy; addText(640, 380, 'A lost cow finds its way home', '#b6ffbf', 26); }
    startWave(wave + 1);
  }
}

function update(dt) {
  gt += dt;
  for (const f of fireflies) { f.x += Math.sin(gt * .7 + f.p) * 18 * dt; f.y += Math.cos(gt * .5 + f.p * 2) * 12 * dt; }
  if (state === 'title') { updateKrishna(dt); updateChakra(dt); updateCows(dt); }
  else if (state === 'play') {
    updateKrishna(dt); updateChakra(dt); updateWaves(dt); updateDemons(dt); updateBoss(dt);
    if (state === 'play') { updateCows(dt); updateVenom(dt); updateButter(dt); updateRing(dt); }
  } else {
    endT += dt;
    if (state === 'won') {
      updateBoss(dt);
      const t = Math.min(1, endT / 1.4), e = t * t * (3 - 2 * t), sp = headPos(2);
      kr.x = kr.sx + (sp.x - kr.sx) * e; kr.y = kr.sy + (sp.y - 26 - kr.sy) * e - Math.sin(t * Math.PI) * 140;
      if (t >= 1) { kr.face = Math.sin(endT * 3) > 0 ? 1 : -1; kr.walk += dt * 9; kr.bob = -Math.abs(Math.sin(endT * 6)) * 12; kr.moving = true; }
      ch.x = hand().x; ch.y = hand().y - 13; ch.rot += dt * 7;
      if (Math.random() < dt * 12) petal(rand(-100, W), -10);
      if (Math.random() < dt * 3) note(kr.x + rand(-60, 60), kr.y - 110);
      updateCows(dt);
    }
  }
  for (const q of particles) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.vr) q.rot += q.vr * dt; }
  particles = particles.filter(q => q.life > 0);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < 1.4);
}

  if (boss) {
    const hp = boss.heads.reduce((s, h) => s + Math.max(0, h.hp), 0);
    text('KALIYA', W / 2, 102, 18, '#a8ffcf', TITLE_FONT, 400);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(ctx, W / 2 - 200, 114, 400, 10, 5); ctx.fill();
    ctx.fillStyle = lin(ctx, W / 2 - 200, 0, W / 2 + 200, 0, ['#2ecc71', '#1abc9c']); rr(ctx, W / 2 - 200, 114, 400 * hp / 40, 10, 5); ctx.fill();
  }
  if (bannerT > 0) {
    const a = Math.min(1, bannerT / .5, (3.2 - bannerT) / .4);
    ctx.globalAlpha = a;
    ctx.fillStyle = lin(ctx, 0, 0, W, 0, ['rgba(40,10,60,0)', 'rgba(40,10,60,.65)', 'rgba(40,10,60,0)']); ctx.fillRect(0, 300, W, 110);
    text(`Wave ${wave + 1}`, W / 2, 326, 20, '#ffcf6a');
    ctx.font = `400 50px ${TITLE_FONT}`; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(20,5,30,.6)'; ctx.fillText(WAVES[wave].name, W / 2 + 3, 373);
    ctx.fillStyle = lin(ctx, 0, 350, 0, 390, ['#fff4c2', '#ffb838']); ctx.fillText(WAVES[wave].name, W / 2, 370);
    ctx.globalAlpha = 1;
  }
}
function bigTitle(s, y, size) {
  ctx.font = `400 ${size}px ${TITLE_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(20,5,30,.7)'; ctx.fillText(s, W / 2 + 4, y + 4);
  ctx.fillStyle = lin(ctx, 0, y - size / 2, 0, y + size / 2, ['#fff7cf', '#ffc84a', '#ff8a1e']); ctx.fillText(s, W / 2, y);
}
function drawOverlay() {
  if (state === 'title') {
    ctx.fillStyle = 'rgba(20,6,34,.55)'; ctx.fillRect(0, 0, W, H);
    bigTitle('Gokul Rakshak', 150, 92);
    text("Protect Vrindavan's cows from the asuras", W / 2, 222, 24, '#ffe9c4', UI_FONT, 500);
    const lines = [['Move', 'Krishna follows your mouse'], ['Click', 'hurl the Sudarshana Chakra — it returns to Him'], ['Flute', 'when it glows, click it to play the divine melody'], ['Makhan', 'touch butter pots for a stronger chakra'], ['Rescue', 'strike an asura carrying a cow to set it free']];
    lines.forEach(([k, v], i) => { text(k, W / 2 - 170, 290 + i * 38, 20, '#ffcf6a', UI_FONT, 700, 'right'); text(v, W / 2 - 150, 290 + i * 38, 20, '#fff', UI_FONT, 500, 'left'); });
    ctx.globalAlpha = .6 + .4 * Math.sin(gt * 3); text('Click anywhere to begin', W / 2, 670, 28, '#fff3b0', TITLE_FONT, 400); ctx.globalAlpha = 1;
  } else if (state === 'won') {
    const a = Math.min(1, endT / 1); ctx.globalAlpha = a;
    ctx.fillStyle = lin(ctx, 0, 0, W, 0, ['rgba(40,10,60,0)', 'rgba(40,10,60,.7)', 'rgba(40,10,60,0)']); ctx.fillRect(0, 420, W, 215);
    bigTitle('Jai Shri Krishna!', 470, 76);
    text('Kaliya bows before Krishna — Gokul is safe', W / 2, 530, 24, '#fff');
    text(`Score ${score}   ·   Cows saved ${cows.filter(c => c.state !== 'lost').length} / 5`, W / 2, 566, 20, '#ffe9c4', UI_FONT, 500);
    if (endT > 1.2) text('Click to play again', W / 2, 610, 20, '#fff3b0', UI_FONT, 500);
    ctx.globalAlpha = 1;
  } else if (state === 'lost') {
    ctx.fillStyle = `rgba(20,6,34,${Math.min(.65, endT)})`; ctx.fillRect(0, 0, W, H);
    bigTitle('The herd has been taken…', 300, 60);
    text(`Reached wave ${wave + 1}   ·   Score ${score}`, W / 2, 370, 22, '#fff', UI_FONT, 500);
    if (endT > 1.2) text('Click to try again', W / 2, 420, 22, '#fff3b0', UI_FONT, 500);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120a1f'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.drawImage(bg, 0, 0, W, H);
  for (let i = 0; i < 34; i++) {
    const x = (hash(i) * W + gt * 14 * (hash(i + 3) + .4)) % W, y = 264 + hash(i + 7) * 44;
    ctx.fillStyle = `rgba(255,235,210,${.14 + .14 * Math.sin(gt * 2 + i)})`; ctx.fillRect(x, y, 14 + hash(i + 1) * 20, 1.4);
  }
  if (boss) drawBoss();
  const ents = [];
  for (const c of cows) if (c.state !== 'lost') ents.push([c.y - (c.state === 'carried' ? .05 : 0), () => drawCow(c)]);
  for (const d of demons) ents.push([d.y, () => drawDemon(d)]);
  for (const b of butters) ents.push([b.y, () => drawButter(b)]);
  ents.push([state === 'won' ? 1e4 : kr.y, drawKrishna]);
  ents.sort((a, b) => a[0] - b[0]).forEach(e => e[1]());
  for (const v of venoms) { glow(GLOW.green, v.x, v.y, 28, .9); ctx.fillStyle = '#b8ff7a'; circle(ctx, v.x, v.y, 7); ctx.fillStyle = '#2a7a1a'; circle(ctx, v.x + 2, v.y + 2, 3); }
  const R = power > 0 ? 30 : 20;
  ch.trail.forEach((p, i) => glow(power > 0 ? GLOW.blue : GLOW.gold, p.x, p.y, R * 1.6 * (1 - i / 10), .35 * (1 - i / 10)));
  drawChakra(ch.x, ch.y, ch.rot, state === 'won' || ch.state === 'held' ? 13 : R);
  if (ring) {
    const a = 1 - ring.r / 1500;
    for (const [dr, w, al] of [[0, 10, .5], [-14, 4, .8], [-30, 2, .5]]) { ctx.strokeStyle = `rgba(255,225,140,${al * a})`; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(ring.x, ring.y, Math.max(1, ring.r + dr), 0, 7); ctx.stroke(); }
  }
  for (const q of particles) {
    const a = q.life / q.max;
    if (q.k === 'spark') { glow(GLOW[q.col], q.x, q.y, q.size * 4 * a, a); ctx.fillStyle = `rgba(255,255,255,${a})`; circle(ctx, q.x, q.y, q.size * .35); }
    else if (q.k === 'smoke') { ctx.fillStyle = `rgba(45,12,60,${a * .45})`; circle(ctx, q.x, q.y, q.size * (2 - a)); }
    else if (q.k === 'orb') { const x = q.x + Math.sin(gt * 4 + q.ph) * 8; glow(GLOW.gold, x, q.y, 34 * a + 6, a); ctx.fillStyle = `rgba(255,255,230,${a})`; circle(ctx, x, q.y, 4 * a + 1); }
    else if (q.k === 'note') { ctx.globalAlpha = a; text(q.s, q.x + Math.sin(gt * 3 + q.size) * 6, q.y, q.size, `hsl(${q.hue},100%,75%)`); ctx.globalAlpha = 1; }
    else if (q.k === 'petal') { ctx.save(); ctx.translate(q.x + Math.sin(gt * 2 + q.rot) * 10, q.y); ctx.rotate(q.rot); ctx.fillStyle = `hsla(${q.hue},90%,70%,${Math.min(1, a * 3)})`; oval(ctx, 0, 0, q.size, q.size * .5); ctx.restore(); }
  }
  for (const f of fireflies) glow(GLOW.ff, f.x, f.y, 10, .35 + .35 * Math.sin(gt * 3 + f.p * 5));
  for (const t of texts) { ctx.globalAlpha = Math.min(1, (1.4 - t.t) * 2); text(t.s, t.x, t.y - t.t * 50, t.size, t.col); }
  ctx.globalAlpha = 1;
  ctx.drawImage(vig, 0, 0, W, H);
  if (state === 'play') drawHUD();
  drawOverlay();
  // cursor
  ctx.strokeStyle = 'rgba(255,225,140,.9)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 11, 0, 7); ctx.stroke();
  for (let i = 0; i < 4; i++) { const a = gt * 2 + i * Math.PI / 2; line(ctx, mouse.x + Math.cos(a) * 14, mouse.y + Math.sin(a) * 14, mouse.x + Math.cos(a) * 19, mouse.y + Math.sin(a) * 19); }
  ctx.fillStyle = '#fff3c4'; circle(ctx, mouse.x, mouse.y, 2);
  ctx.restore();
}

// ---------- input & boot ----------
const toLogical = e => ({ x: (e.clientX * dpr - OX) / S, y: (e.clientY * dpr - OY) / S });
cvs.addEventListener('pointermove', e => Object.assign(mouse, toLogical(e)));
cvs.addEventListener('pointerdown', e => { const p = toLogical(e); Object.assign(mouse, p); click(p.x, p.y); });
cvs.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', resize);
document.fonts?.load(`20px "Yatra One"`).catch(() => { });

// Deterministic gameplay self-check: open index.html?test
function runTests() {
  const res = [], check = (n, ok) => res.push([n, !!ok]);
  const sim = s => { for (let i = 0; i < s / STEP; i++) update(STEP); };
  const fresh = () => { reset(); startGame(); autoWaves = false; queue = []; demons = []; bannerT = 0; butterT = 1e9; mouse.x = kr.x; mouse.y = kr.y; };

  fresh(); mouse.x = 900; mouse.y = 600; sim(2);
  check('Krishna follows the mouse', dist(kr.x, kr.y, 900, 600) < 5);

  fresh(); const imp = spawnDemon('imp', 1000, 520); throwChakra(1000, 496); sim(.6);
  check('chakra slays an asura', imp.dead && score >= 100);
  sim(1.5); check('chakra returns to Krishna', ch.state === 'held');

  fresh(); mouse.x = 60; mouse.y = 340; let c = cows[0], d = spawnDemon('imp', c.x + 35, c.y); sim(.2);
  check('asura grabs a cow', c.state === 'carried' && d.carry === c);
  kill(d); check('slaying the carrier frees the cow', c.state === 'return');
  sim(6); check('freed cow walks home', c.state === 'home');

  fresh(); mouse.x = 60; mouse.y = 340; c = cows[3]; spawnDemon('imp', c.x + 35, c.y); sim(15);
  check('escaped asura takes the cow', c.state === 'lost');

  fresh(); for (let i = 0; i < 5; i++) spawnDemon('imp', 200 + i * 200, 380); flute = 1; click(FLUTE_BTN.x, FLUTE_BTN.y);
  check('clicking the charged flute plays it', ring !== null && flute === 0);
  sim(2); check('flute wave clears the asuras', demons.length === 0);

  fresh(); flute = .5; click(FLUTE_BTN.x, FLUTE_BTN.y);
  check('uncharged flute click throws chakra instead', ring === null && ch.state === 'out');

  fresh(); butters.push({ x: kr.x, y: kr.y, life: 5 }); sim(.1);
  check('butter pot grants makhan power', power > 0 && butters.length === 0);

  fresh(); c = cows[1]; venoms.push({ x: c.x, y: c.y - 30, vx: 0, vy: 0, dead: false }); mouse.x = 60; mouse.y = 340; sim(.05);
  check('venom scares a cow away', c.state === 'flee');
  kr.x = mouse.x = c.x; kr.y = mouse.y = c.y; sim(.05);
  check('touching a fleeing cow calms it', c.state === 'return');

  fresh(); venoms.push({ x: kr.x, y: kr.y - 50, vx: 0, vy: 0, dead: false }); sim(.05);
  check('Krishna destroys venom on touch', venoms.length === 0);

  fresh(); autoWaves = true; sim(2);
  check('clearing a wave starts the next', wave === 1);

  fresh(); cows.forEach(c => c.state = 'lost'); sim(.05);
  check('losing every cow ends the game', state === 'lost');

  fresh(); startWave(4); queue = []; bannerT = 0; sim(3);
  const p = headPos(2); boss.summonT = boss.spitT = 1e9; throwChakra(p.x, p.y); sim(.5);
  check('chakra wounds Kaliya', boss.heads[2].hp < 8);
  boss.heads.forEach((h, i) => damageHead(i, 99)); sim(.05);
  check('subduing all five heads wins', state === 'won');

  reset();
  const pass = res.filter(r => r[1]).length;
  document.title = `TESTS ${pass === res.length ? 'PASS' : 'FAIL'} ${pass}/${res.length}`;
  console.log(document.title, res);
  window.testResults = res;
}

resize(); reset();
if (TEST) runTests();
let last = performance.now(), acc = 0;
requestAnimationFrame(function frame(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
